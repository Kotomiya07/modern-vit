# ViT model variant: Small configuration for Imagenette (faster training)
config:
  # Image and patch configuration
  image_size: 224
  patch_size: 16
  channels: 3
  
  # Model architecture (smaller)
  num_classes: 10
  dim: 256
  depth: 6
  heads: 4
  n_kv_heads: 4
  multiple_of: 256
  
  # MoE configuration (disabled)
  n_experts: 1
  n_experts_per_tok: 1
  router_config: null
  moe_layers: []
  
  # Training configuration
  lr: 1e-3
  weight_decay: 0.05
  aux_loss_weight: 0.01
