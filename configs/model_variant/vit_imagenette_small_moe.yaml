# ViT model variant: Small configuration with MoE for Imagenette
config:
  # Image and patch configuration
  image_size: 224
  patch_size: 16
  channels: 3
  
  # Model architecture (smaller)
  num_classes: 10
  dim: 256
  depth: 6
  heads: 4
  n_kv_heads: 4
  multiple_of: 256
  
  # MoE configuration (enabled)
  n_experts: 4
  n_experts_per_tok: 2
  router_config:
    type: token_choice
    k: 2
  # Apply MoE to all layers for maximum capacity
  moe_layers: [0, 1, 2, 3, 4, 5]
  
  # Training configuration
  lr: 1e-3
  weight_decay: 0.05
  aux_loss_weight: 0.01

